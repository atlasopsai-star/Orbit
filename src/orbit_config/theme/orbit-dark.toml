file_panel_item_selected_fg = "#0B1020"
file_panel_item_selected_bg = "#F6C453"

#-- Footer
footer_fg = "#AFC2D9"
footer_bg = "#0A0F1E"
footer_border = "#26344D"
footer_border_active = "#6EE7F9"

#-- Sidebar
sidebar_fg = "#C4D1E3"
sidebar_bg = "#0D1426"
sidebar_title = "#F6C453"
sidebar_border = "#26344D"
sidebar_border_active = "#6EE7F9"
sidebar_item_selected_fg = "#0B1020"
sidebar_item_selected_bg = "#F6C453"
