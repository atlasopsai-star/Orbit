###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "catppuccin-mocha"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#D7E3F4"
full_screen_bg = "#0B1020"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#F6C453", "#6EE7F9"]
directory_icon_color = "#6EE7F9"

#-- File Panel
file_panel_fg = "#D7E3F4"
file_panel_bg = "#0F172A"
file_panel_border = "#26344D"
file_panel_border_active = "#F6C453"
